<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://api.github.com; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <meta name="theme-color" content="#5d53e8" />
    <meta
      name="description"
      content="A little space for your next big idea. Infinite boards, organized in projects and versioned with GitHub."
    />
    <title>GitBoard — a space for your next big idea</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./css/app.css" />
    <link rel="stylesheet" href="./css/editor.css" />
    <script type="module" src="./js/app.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="modal" aria-labelledby="modal-title"></dialog>
    <noscript
      >GitBoard needs JavaScript to edit and save your boards. Please enable it
      in your browser.</noscript
    >
  </body>
</html>
