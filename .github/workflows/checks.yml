name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          for file in js/*.js; do
            node --check "$file"
          done
      - name: Test project persistence and GitHub integration
        run: node --test tests/*.test.js
